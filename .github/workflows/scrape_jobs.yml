name: Hourly Job Publication Pipeline

on:
  schedule:
    - cron: "5 0,9-21 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "LinkedIn posted-time lookback; use 96 for missed-run recovery"
        required: false
        default: "48"
        type: choice
        options: ["24", "48", "72", "96", "168"]
      archetype:
        description: "Optional single canonical lane for manual recovery; blank scrapes all enabled lanes"
        required: false
        default: ""
        type: string

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    # Multi-lane searches are intentionally serialized around the synchronous
    # Supabase client; allow the configured query set to finish cleanly.
    timeout-minutes: 180
    outputs:
      discovery_cycle_id: ${{ steps.scraper.outputs.discovery_cycle_id }}
      discovery_sequence: ${{ steps.scraper.outputs.discovery_sequence }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configure manual LinkedIn recovery window
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REQUESTED_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
        run: |
          echo "LINKEDIN_RECOVERY_LOOKBACK_HOURS=${REQUESTED_LOOKBACK_HOURS}" >> "$GITHUB_ENV"
          echo "Requested recovery lookback: ${REQUESTED_LOOKBACK_HOURS}h"
      - name: Run scraper script
        id: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_ARCHETYPE: ${{ inputs.archetype || '' }}
          LINKEDIN_DISCOVERY_MODE: adaptive_queue
        run: python scraper.py

  freehire_compat:
    if: ${{ inputs.archetype == '' || inputs.archetype == null }}
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Incrementally classify Freehire compatibility
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREEHIRE_DRAIN_BACKLOG: "false"
          FREEHIRE_CLASSIFY_LIMIT: "300"
        run: python incremental_freehire_compat.py

  publication_gate:
    if: ${{ always() && (inputs.archetype == '' || inputs.archetype == null) }}
    needs: [scrape, freehire_compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scrape_watermark: ${{ steps.gate.outputs.scrape_watermark }}
      published: ${{ steps.gate.outputs.published }}
      generation: ${{ steps.gate.outputs.generation }}
      outcome: ${{ steps.gate.outputs.outcome }}
      requested_cycle_id: ${{ steps.gate.outputs.requested_cycle_id }}
      eligible_cycle_id: ${{ steps.gate.outputs.eligible_cycle_id }}
      published_at: ${{ steps.gate.outputs.published_at }}
      row_count: ${{ steps.gate.outputs.row_count }}
      schema_version: ${{ steps.gate.outputs.schema_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused gate dependencies
        run: pip install python-dotenv supabase
      - name: Verify and finalize source publication
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python publication_gate.py
          --scrape-result "${{ needs.scrape.result }}"
          --freehire-compat-result "${{ needs.freehire_compat.result }}"
          --discovery-cycle-id "${{ needs.scrape.outputs.discovery_cycle_id }}"
