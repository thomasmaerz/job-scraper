name: Freehire Compatibility Frontfill

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum jobs to classify per pass"
        required: false
        default: "200"
        type: choice
        options: ["50", "100", "200", "500"]
      drain_backlog:
        description: "Continue until no eligible jobs remain"
        required: false
        default: "false"
        type: boolean
      replacement_backfill:
        description: "Reclassify current rows once"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Classify pending and changed LinkedIn jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREEHIRE_CLASSIFY_LIMIT: ${{ inputs.limit || '200' }}
          FREEHIRE_DRAIN_BACKLOG: ${{ inputs.drain_backlog || 'false' }}
          FREEHIRE_REPLACEMENT_BACKFILL: ${{ inputs.replacement_backfill || 'false' }}
        run: |
          case "$FREEHIRE_CLASSIFY_LIMIT" in
            50|100|200|500) ;;
            *) echo "Invalid FREEHIRE_CLASSIFY_LIMIT: $FREEHIRE_CLASSIFY_LIMIT" >&2; exit 2 ;;
          esac
          args=(--apply --limit "$FREEHIRE_CLASSIFY_LIMIT")
          if [[ "${{ inputs.drain_backlog }}" == "true" ]]; then args+=(--drain-backlog); fi
          if [[ "${{ inputs.replacement_backfill }}" == "true" ]]; then args+=(--replacement-backfill); fi
          python backfill_freehire_compat.py "${args[@]}"
