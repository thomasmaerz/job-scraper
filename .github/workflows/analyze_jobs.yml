name: Analyze Job Insights

on:
  schedule:
    # Weekly on Monday at 06:00 UTC to control LLM usage.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      drain_backlog:
        description: "Continue processing until no unanalyzed jobs remain"
        required: false
        default: "false"
      replacement_backfill:
        description: "Reanalyze previously analyzed jobs once"
        required: false
        default: "false"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job insights analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOB_INSIGHTS_BACKFILL_ALL: ${{ github.event.inputs.drain_backlog || 'false' }}
          JOB_INSIGHTS_REPLACEMENT_BACKFILL: ${{ github.event.inputs.replacement_backfill || 'false' }}
        run: python analyze_jobs.py
