# .github/workflows/scrape_jobs.yml
name: Daily Job Scraper

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "LinkedIn posted-time lookback; use 96 for missed-run recovery"
        required: false
        default: "48"
        type: choice
        options:
          - "24"
          - "48"
          - "72"
          - "96"
          - "168"

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine LinkedIn recovery window
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
        run: |
          last_success_at="$(gh run list --workflow scrape_jobs.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          echo "LINKEDIN_LOOKBACK_HOURS=${REQUESTED_LOOKBACK_HOURS}" >> "$GITHUB_ENV"
          echo "LINKEDIN_LAST_SUCCESS_AT=${last_success_at}" >> "$GITHUB_ENV"
          echo "Requested lookback: ${REQUESTED_LOOKBACK_HOURS}h; last successful run: ${last_success_at:-unavailable}"

      - name: Run scraper script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py

      - name: Frontfill Freehire compatibility
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREEHIRE_DRAIN_BACKLOG: "false"
          FREEHIRE_CLASSIFY_LIMIT: "100"
        run: python frontfill_freehire_compat.py
