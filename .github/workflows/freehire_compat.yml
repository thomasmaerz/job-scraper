name: Manual Freehire Compatibility Recovery

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Jobs fetched per batched Supabase page"
        required: true
        default: "500"
        type: choice
        options: ["100", "300", "500", "1000"]
      apply:
        description: "Persist changes (false performs a dry run)"
        required: true
        default: false
        type: boolean
      drain_backlog:
        description: "Continue fetching batches until no eligible work remains"
        required: true
        default: true
        type: boolean
      replacement_backfill:
        description: "Reclassify current rows older than replacement_before"
        required: true
        default: false
        type: boolean
      replacement_before:
        description: "Stable ISO-8601 cutoff; required for resumable replacement runs"
        required: false
        type: string

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run compatibility recovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREEHIRE_CLASSIFY_LIMIT: ${{ inputs.limit }}
          FREEHIRE_APPLY: ${{ inputs.apply }}
          FREEHIRE_DRAIN_BACKLOG: ${{ inputs.drain_backlog }}
          FREEHIRE_REPLACEMENT_BACKFILL: ${{ inputs.replacement_backfill }}
          FREEHIRE_REPLACEMENT_BEFORE: ${{ inputs.replacement_before }}
        run: |
          case "$FREEHIRE_CLASSIFY_LIMIT" in
            100|300|500|1000) ;;
            *) echo "Invalid FREEHIRE_CLASSIFY_LIMIT: $FREEHIRE_CLASSIFY_LIMIT" >&2; exit 2 ;;
          esac
          case "$FREEHIRE_APPLY" in
            true|false) ;;
            *) echo "Invalid FREEHIRE_APPLY: $FREEHIRE_APPLY" >&2; exit 2 ;;
          esac
          args=(--limit "$FREEHIRE_CLASSIFY_LIMIT")
          if [[ "$FREEHIRE_APPLY" == "true" ]]; then args+=(--apply); fi
          if [[ "$FREEHIRE_DRAIN_BACKLOG" == "true" ]]; then args+=(--drain-backlog); fi
          if [[ "$FREEHIRE_REPLACEMENT_BACKFILL" == "true" ]]; then
            if [[ -z "$FREEHIRE_REPLACEMENT_BEFORE" ]]; then
              echo "replacement_before is required for replacement_backfill" >&2
              exit 2
            fi
            args+=(--replacement-backfill --replacement-before "$FREEHIRE_REPLACEMENT_BEFORE")
          fi
          python backfill_freehire_compat.py "${args[@]}"
