name: Resume Customization

on:
  workflow_dispatch:
    inputs:
      archetype:
        description: "Optional single canonical lane; blank processes all enabled lanes"
        required: false
        default: ""
        type: string

concurrency:
  group: lane-resume-generation
  cancel-in-progress: false

jobs:
  customize_resumes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found. If your script has dependencies, please create this file."
          fi

      - name: Run resume customization script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # LLM Configuration (set via Repository Variables / Secrets)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOB_RESUME_ARCHETYPE: ${{ inputs.archetype || '' }}
        run: python custom_resume_generator.py
