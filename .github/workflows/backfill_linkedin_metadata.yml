name: Backfill LinkedIn Metadata

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum LinkedIn detail pages to check"
        required: false
        default: "500"
      apply:
        description: "Persist recovered metadata"
        required: false
        default: "false"

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Backfill available LinkedIn detail metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python backfill_linkedin_metadata.py
          --limit "${{ inputs.limit }}"
          ${{ inputs.apply == 'true' && '--apply' || '' }}
