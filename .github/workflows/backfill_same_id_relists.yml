name: Backfill Same-ID Relists

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum canonical jobs to inspect"
        required: false
        default: "500"
        type: choice
        options: ["100", "500", "1000", "5000"]
      apply:
        description: "Persist reviewed lower-bound relist repairs"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: same-id-relist-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Repair same-ID relist lower bounds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          limit="${{ inputs.limit }}"
          case "$limit" in
            100|500|1000|5000) ;;
            *) echo "Invalid limit: $limit" >&2; exit 2 ;;
          esac
          args=(--limit "$limit")
          if [[ "${{ inputs.apply }}" == "true" ]]; then args+=(--apply); fi
          python backfill_same_id_relists.py "${args[@]}"
